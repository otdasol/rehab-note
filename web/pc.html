<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AI Rehab노트 · PC 받기함</title>
<style>
  :root { color-scheme: light; --ink: #1d2a2a; --mute: #5f6f6f; --teal: #1f8a86; --teal-soft: #e3f3f2; --line: #dde6e5; --bg: #F7F9F9; --warn: #b45f06; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 "Pretendard Variable", Pretendard, system-ui, -apple-system, "Malgun Gothic", sans-serif; letter-spacing: -0.01em; }
  main { max-width: 760px; margin: 0 auto; padding: 28px 20px 60px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  header img { width: 40px; height: 40px; border-radius: 10px; }
  h1 { font-size: 20px; margin: 0; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; margin-bottom: 14px; }
  .code { font: 700 40px/1.2 ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: 4px; color: var(--teal); margin: 8px 0 6px; user-select: all; }
  .muted { color: var(--mute); } .small { font-size: 13px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button { font: inherit; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 600; }
  button.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
  button:active { transform: translateY(1px); }
  .item { border-top: 1px solid var(--line); padding: 14px 0; }
  .item:first-of-type { border-top: 0; }
  .item b { font-size: 15px; } .item .when { color: var(--mute); font-size: 13px; margin-left: 8px; }
  pre { white-space: pre-wrap; word-break: break-word; margin: 8px 0 10px; padding: 12px 14px; background: var(--bg); border-radius: 10px; font: 14px/1.6 inherit; max-height: 320px; overflow: auto; }
  .status { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #c7d2d1; margin-right: 6px; }
  .status.on { background: #2bb673; }
  .copied { background: var(--teal-soft); color: var(--teal); border-color: var(--teal-soft); }
  label.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--mute); cursor: pointer; }
  .empty { color: var(--mute); padding: 18px 0; text-align: center; }
  .notice { font-size: 13px; color: var(--warn); margin-top: 8px; }
</style>
</head>
<body>
<main>
  <header><img src="design/logo-ai.png" alt=""><h1>AI Rehab노트 · PC 받기함</h1></header>

  <div class="card">
    <div class="small muted">폰 앱 → 설정 › 기관판 › <b>PC 받기함</b>에 이 코드를 넣으세요 (한 번만)</div>
    <div class="code" id="code">····-····-····</div>
    <div class="row">
      <span class="small"><span class="status" id="dot"></span><span id="state">폰을 기다리는 중…</span></span>
      <span style="flex:1"></span>
      <label class="chk"><input type="checkbox" id="remember"> 이 PC 기억하기 (내 PC일 때만)</label>
      <button id="newCode">새 코드</button>
    </div>
    <div class="notice">받은 글은 이 창을 닫으면 사라져요. 공용 PC에서는 "기억하기"를 켜지 마세요.</div>
  </div>

  <div class="card">
    <div class="row" style="margin-bottom:6px"><b>받은 기록</b><span style="flex:1"></span><button id="clearAll">모두 지우기</button></div>
    <div id="list"><div class="empty">폰에서 "복사"를 누르면 여기에 떠요. 복사 → 전자차트에 붙여 넣으세요.</div></div>
  </div>

  <p class="small muted">글은 폰에서 암호화되어 오고, 이 화면에서만 풀립니다. 서버에는 암호문이 10분만 머물다 지워져요. 환자 이름·등록번호는 넣지 않는 앱이지만, 받은 글도 전자차트에 옮긴 뒤 지우세요.</p>
</main>
<script>
const SB_URL = "https://orlabcbhnarulribebvy.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ybGFiY2JobmFydWxyaWJlYnZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4Mzk5NTEsImV4cCI6MjEwODQxNTk1MX0.Y0hTTjjhm7qIXmxcry3rur4YCjFyzCE_Skx7RMfYKWw";
const ALPHABET = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
const $ = (s) => document.querySelector(s);
const items = []; // 메모리에만 둔다
let code = "", key = null, pairId = "", timer = null, seen = new Set();

function randomCode() { const a = new Uint8Array(12); crypto.getRandomValues(a); return [...a].map((x) => ALPHABET[x % ALPHABET.length]).join(""); }
const fmtCode = (c) => c.replace(/(.{4})(?=.)/g, "$1-");
async function derive(c) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(c), "PBKDF2", false, ["deriveKey"]);
  key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: enc.encode("rehabnote-pc-v1"), iterations: 200000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  const idBuf = await crypto.subtle.digest("SHA-256", enc.encode("rehabnote-pair:" + c));
  pairId = [...new Uint8Array(idBuf)].slice(0, 16).map((x) => x.toString(16).padStart(2, "0")).join("");
}
const unb64 = (t) => Uint8Array.from(atob(t), (ch) => ch.charCodeAt(0));
async function decrypt(ct) {
  const [ivB, dataB] = ct.split(".");
  const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(ivB) }, key, unb64(dataB));
  return JSON.parse(new TextDecoder().decode(buf));
}
async function sb(path, opt = {}) {
  const r = await fetch(SB_URL + path, { method: opt.method || "GET", headers: { apikey: ANON, Authorization: "Bearer " + ANON, ...(opt.prefer ? { Prefer: opt.prefer } : {}) } });
  if (!r.ok) throw new Error("서버 " + r.status);
  return opt.method === "DELETE" ? null : r.json();
}
async function poll() {
  if (!pairId) return;
  try {
    const rows = await sb("/rest/v1/pc_relay?pair_id=eq." + pairId + "&select=id,ciphertext,created_at&order=created_at");
    $("#dot").className = "status on"; $("#state").textContent = "연결 대기 중 · 폰에서 복사하면 바로 떠요";
    for (const row of rows) {
      if (seen.has(row.id)) continue; seen.add(row.id);
      try { const m = await decrypt(row.ciphertext); items.unshift({ ...m, id: row.id }); render(); $("#state").textContent = "방금 받았어요"; }
      catch { /* 다른 코드로 보낸 것(풀 수 없음) → 지우지 않고 둔다 */ continue; }
      sb("/rest/v1/pc_relay?id=eq." + row.id, { method: "DELETE", prefer: "return=minimal" }).catch(() => {});
    }
  } catch (e) { $("#dot").className = "status"; $("#state").textContent = "서버에 닿지 않아요: " + e.message; }
}
function esc(t) { return String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function render() {
  const list = $("#list");
  if (!items.length) { list.innerHTML = '<div class="empty">폰에서 "복사"를 누르면 여기에 떠요. 복사 → 전자차트에 붙여 넣으세요.</div>'; return; }
  list.innerHTML = items.map((it, i) => `<div class="item"><b>${esc(it.title)}</b><span class="when">${new Date(it.at).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" })}</span>
    <pre>${esc(it.text)}</pre>
    <div class="row"><button class="primary" data-copy="${i}">복사</button><button data-del="${i}">지우기</button></div></div>`).join("");
}
$("#list").addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.copy !== undefined) { await navigator.clipboard.writeText(items[+b.dataset.copy].text); b.textContent = "복사했어요 ✓"; b.classList.add("copied"); setTimeout(() => { b.textContent = "복사"; b.classList.remove("copied"); }, 1500); }
  if (b.dataset.del !== undefined) { items.splice(+b.dataset.del, 1); render(); }
});
$("#clearAll").onclick = () => { items.length = 0; render(); };
async function setCode(c) {
  code = c; $("#code").textContent = fmtCode(c); seen = new Set();
  $("#dot").className = "status"; $("#state").textContent = "키 준비 중…";
  await derive(c);
  if ($("#remember").checked) localStorage.setItem("rehabnote-pc-code", c); else localStorage.removeItem("rehabnote-pc-code");
  poll();
}
$("#newCode").onclick = () => setCode(randomCode());
$("#remember").onchange = () => { if ($("#remember").checked) localStorage.setItem("rehabnote-pc-code", code); else localStorage.removeItem("rehabnote-pc-code"); };
(async () => {
  const saved = localStorage.getItem("rehabnote-pc-code");
  if (saved && saved.length === 12) $("#remember").checked = true;
  await setCode(saved && saved.length === 12 ? saved : randomCode());
  timer = setInterval(poll, 3000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
})();
</script>
</body>
</html>
